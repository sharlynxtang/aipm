name: One-time holiday AI briefing

on:
  push:
    tags:
      - 'run-digest-holiday-*'

permissions:
  contents: read

jobs:
  holiday-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send reviewed October 1-7 briefing
        env:
          FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
        run: python holiday_once.py --send
