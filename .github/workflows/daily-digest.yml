name: Daily AI digest

on:
  schedule:
    # 11:00 China/Singapore time. GitHub may start scheduled runs late.
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    # An explicit tag push can trigger a delivery when GitHub API access is unavailable.
    tags:
      - 'run-digest-*'

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send daily briefing
        env:
          FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
        run: python -m ai_digest --send
